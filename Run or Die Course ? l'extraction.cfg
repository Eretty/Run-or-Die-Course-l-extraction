# Maximum number of game days (after the radio becomes active) to reach the extraction point.   0 to disable the deadline. Minimum=0 Maximum=180 Par défaut=0
WQS_DeadlineDays_opt=0

# Duration of the extraction event in game hours.   Recommended 3 or 4 hours Minimum=3 Maximum=48 Par défaut=3
WQS_ExtractionEventHoursDuration_opt=3

# Governs the overall difficulty of the extraction event. Minimum=0.10 Maximum=4.00 Par défaut=1.00
WQS_ExtractionEventDifficulty_opt=1.0

# Number of game days that must pass before the radio signal becomes active.  0 to disable this option and have signal already active at start. Minimum=0 Maximum=365 Par défaut=0
WQS_WaitForSignalDuration_opt=0

# How many repeater antennas you must build in various places of the map to get enough radio signal strength.  0 to disable this option and have full signal strength from the start. Minimum=0 Maximum=4 Par défaut=0
WQS_RepeatersModeHowMany_opt=0

# Multiplier to the chance of finding mod related items in the loot of zombie bodies.(walkie talkie, map fragment of repeater location, etc.) Minimum=0.10 Maximum=5.00 Par défaut=1.00
WQS_ItemInZombieLootMultiplier_opt=1.0

# Start with the item needed for extraction, you don't need to find it
WQS_StartWithExtractionItem_opt=false

# If selected you must stay near the extraction point during the entire duration of the extraction event.
WQS_ConfinedMode_opt=false

# If selected, the quest will NOT be active at the beginning and can only be started after crafting the antenna.
WQS_GameModeExtended_opt=false

