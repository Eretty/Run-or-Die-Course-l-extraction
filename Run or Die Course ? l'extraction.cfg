# La distance qu'un zombie essayera de parcourir vers le dernier son qu'il a entendu. Minimum=10 Maximum=1000 Par défaut=100
ZombieConfig.FollowSoundDistance=10

# La taille des groupes que les zombies forment lorsqu'ils ne sont pas occupés. Zéro veut dire que les zombies ne formeront pas de groupes. Les groupes ne se forment pas dans les bâtiments ou les forêts. Minimum=0 Maximum=1000 Par défaut=20
ZombieConfig.RallyGroupSize=20

# Le montant, en pourcentage, permettant à la taille des groupes de zombies de varier par rapport à la valeur par défaut (que ce soit plus grand ou plus petit).   Par exemple, avec une variation de 50% sur une taille de groupe de 20, les groupes pourront varier de 10 à 30 zombies. Minimum=0 Maximum=100 Par défaut=50
ZombieConfig.RallyGroupSizeVariance=50

# La distance que les zombies parcourent pour former des groupes lorsqu'ils ne sont pas occupés. Minimum=5 Maximum=50 Par défaut=20
ZombieConfig.RallyTravelDistance=20

# La distance entre les groupes de zombies. Minimum=5 Maximum=25 Par défaut=15
ZombieConfig.RallyGroupSeparation=25

# Distance à laquelle les membres d'un groupe de zombies restent autour du chef de groupe. Minimum=1 Maximum=10 Par défaut=3
ZombieConfig.RallyGroupRadius=10

# Contrôle le nombre maximum de zombies qui traquent avant que le nettoyage n'ait lieu. 0 signifie que les zombies ne seront jamais nettoyés. La valeur par défaut (300) est fortement recommandée. Augmenter cette valeur ou la définir sur 0 peut causer des problèmes de performances sévères. À des fins de dépannage et de signalement de bugs, veuillez reproduire tout problème avec les paramètres par défaut avant de soumettre un rapport. Minimum=0 Maximum=5000 Par défaut=300
ZombieConfig.ZombiesCountBeforeDelete=300

